# GitHub Pages deploy workflow
name: Deploy site
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Fetch this repo's tree from the private release
        env:
          GH_TOKEN: ${{ secrets.SITE_TOKEN }}
          SOURCE: ${{ vars.SITE_SOURCE_REPO }}
          NAME: ${{ github.event.repository.name }}
        run: |
          gh release download pages --repo "$SOURCE" --pattern "$NAME.tar" --output tree.tar
          mkdir -p _site && tar xf tree.tar -C _site && rm tree.tar
          test -f _site/COPYRIGHT.txt
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
